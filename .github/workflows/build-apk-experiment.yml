# Experimental Android 12 APK build for add_whatremains testing (uploads artifact only, never publishes a release).
name: build-apk-experiment

on:
  push:
    branches: [add_whatremains]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-exp-${{ github.ref }}
  cancel-in-progress: true

env:
  nxGames: "0100853015E86000,010038900DFE0000,0100C3601518C000,0100F7E00C70E000"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: NDK cache
        id: ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358
      - name: Android SDK and NDK
        run: |
          if [ "${{ steps.ndk.outputs.cache-hit }}" != true ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
      - name: Signing key
        run: |
          grep -v '^#' android/app/debug.keystore.b64 | tr -d '\n' | base64 -d > /tmp/debug.keystore
          keytool -list -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey >/dev/null || { echo "::error::debug keystore is invalid"; exit 1; }
          mkdir -p ~/.android && cp /tmp/debug.keystore ~/.android/debug.keystore
          echo "NX_DEBUG_STORE=/tmp/debug.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Packer stage cache
        id: pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pack/stage
          key: packer-${{ hashFiles('android/ondevice/**', 'dm/gfx/tools/dmsh_xlate/**', 'dm/gfx/tools/dmsh_xlate_android/**', 'dm/gfx/tools/*.cs', 'dm/gfx/tools/cra_unscramble.c', 'dm/third_party/ryujinx/**', 'dm/third_party/zstd-zbic/**') }}
      - name: Packer stage
        if: steps.pack.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh ninja-build cmake clang zlib1g-dev
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          android/ondevice/build.sh "$RUNNER_TEMP/pack" all
      - run: echo "NX_PACK_STAGE=$RUNNER_TEMP/pack/stage" >> "$GITHUB_ENV"
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/app/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle', 'android/app/settings.gradle', 'android/app/gradle.properties') }}
          restore-keys: |
            gradle-
      - name: Build
        working-directory: android/app
        env:
          NX_CCACHE: '1'
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: '1'
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPRESS: '1'
        run: |
          ccache -z
          ./gradlew -PnxGames=$nxGames -PnxApp=exp -PnxMinSdk=31 -PnxVersionCode=${{ github.run_number }} --build-cache apk
          ccache -s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polar-android-exp
          path: android/app/out/nxnative-android-exp-android12.apk
